# Live exhibit for the lab. This is the SAME workflow the lab's agent reads at
# lab/.github/workflows/ci.yml, adjusted only for paths -- and it is supposed to
# fail. It runs without id-token: write, so the auth step cannot mint an OIDC
# token and the run stops before anything contacts Google Cloud. That failure is
# the teaching artifact; the lab's synthetic log is a transcript of it.
#
# It triggers on PRs touching the lab's Terraform, or manually from the Actions
# tab (workflow_dispatch). The WIF values below come from repository variables
# that hold intentionally fake, well-formed values -- there is no real pool,
# service account, or project behind them, and none is ever reached.

name: plan

on:
  pull_request:
    paths:
      - 'lab/terraform/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init -backend=false
        working-directory: lab/terraform

      - name: Plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: terraform plan
        working-directory: lab/terraform
